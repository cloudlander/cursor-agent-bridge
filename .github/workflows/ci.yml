name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell script executable bits in Git
        id: exec_bits
        run: |
          set -euo pipefail
          must_exec=(
            app.sh
            scripts/bootstrap-cai-application.sh
            scripts/bootstrap-cai-application.py
            scripts/create-cai-application.sh
            scripts/cursor-api-proxy
            scripts/env.local.sh
            scripts/start-local.sh
            widget-mac/install.sh
            widget-mac/uninstall.sh
          )
          for f in "${must_exec[@]}"; do
            mode="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [[ "$mode" != "100755" ]]; then
              git update-index --chmod=+x "$f"
            fi
          done
          if [[ -n "$(git diff --cached --name-only)" ]]; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "fix(cai): set shell script executable bits in Git"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice:: Committed 100755 modes (API uploads cannot set executable bit). CI will run again on the fix commit."
            exit 0
          fi
          fail=0
          for f in "${must_exec[@]}"; do
            mode="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [[ "$mode" != "100755" ]]; then
              echo "::error:: $f must be mode 100755 in Git (got ${mode:-missing}); run: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          exit "$fail"

      - name: Setup Node.js
        if: steps.exec_bits.outputs.pushed != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.exec_bits.outputs.pushed != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.exec_bits.outputs.pushed != 'true'
        run: npm run typecheck

      - name: Build
        if: steps.exec_bits.outputs.pushed != 'true'
        run: npm run build

      - name: Test
        if: steps.exec_bits.outputs.pushed != 'true'
        run: npm test
