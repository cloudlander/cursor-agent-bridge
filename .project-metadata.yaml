name: Cursor Agent Bridge
description: Running Cursor Agent on Cloudera AI.
author: cloudlander
date: '2026-11-01'
specification_version: 1.0
prototype_version: 1.0
environment_variables:
  APP_NAME:
    default: "Cursor Agent"
    required: false
  APP_SUBDOMAIN:
    default: "agent-cai"
    required: false
  APP_SCRIPT:
    default: "app.py"
    required: false
  APP_CPU:
    default: "1"
    required: false
  APP_MEMORY_GB:
    default: "4"
    required: false
runtimes:
  - editor: JupyterLab
    kernel: Python 3.14
    edition: Hardened
  - editor: JupyterLab
    kernel: Python 3.13
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.12
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.10
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.9
    edition: Standard
tasks:
  - type: create_job
    name: build-project
    entity_label: build-project
    script: scripts/bootstrap-cai-application.py
    short_summary: Creating the build job
  - type: create_job
    name: setup-app
    entity_label: setup-app
    script: scripts/create-cai-application.py
    short_summary: Creating the setup job.
  - type: run_job
    entity_label: build-project
    short_summary: Building...
    long_summary: >-
      Building the Cursor Agent Bridge
  - type: run_job
    entity_label: setup-app
    short_summary: Deploying...
    long_summary: >-
      Deploying Cursor Agent on Cloudera AI.
