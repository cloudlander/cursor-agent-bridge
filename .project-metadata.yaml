name: Cursor Agent Bridge
description: Running Cursor Agent on Cloudera AI.
author: cloudlander
date: '2026-11-01'
specification_version: 1.0
prototype_version: 1.0
environment_variables:
  CAI_APP_NAME:
    default: "Cursor Agent"
    required: false
  CAI_APP_SCRIPT:
    default: "app.py"
    required: false
  CAI_APP_CPU:
    default: "1"
    required: false
  CAI_APP_MEMORY_GB:
    default: "4"
    required: false
  CURSOR_BRIDGE_ROUTER_ENABLED:
    default: "true"
    required: false
  CURSOR_BRIDGE_ROUTER_MONTHLY_BUDGET_USD:
    default: "300"
    required: false
runtimes:
  - editor: JupyterLab
    kernel: Python 3.14
    edition: Hardened
  - editor: JupyterLab
    kernel: Python 3.13
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.12
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.11
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.10
    edition: Standard
  - editor: JupyterLab
    kernel: Python 3.9
    edition: Standard
tasks:
  - type: create_job
    name: build-project
    entity_label: build-project
    script: scripts/bootstrap-cai-application.py
    short_summary: Creating the build and deploy job
  - type: run_job
    entity_label: build-project
    short_summary: Building and deploying...
    long_summary: >-
      Bootstrap runtime, build cursor-agent-bridge, and register the CAI application.
